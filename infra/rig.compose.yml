# GPU rig: sam-linux's RTX 5070 Ti (docs/infra/README.md section 4). Architecture section 12 names
# this file. vllm-nv serves the VLM; vlm-worker-nv claims `vlm` jobs from the control plane's api and
# calls it. The 3070's perception worker is in control-plane.compose.yml (profile `perception`).
#
# Settings: infra/.env, copied from infra/.env.example. Compose fills the ${...} values from it and
# loads it whole into vllm-nv. The worker's token is in ${PDM_ENV}/.env.rig-5070ti-vlm-1 (infra
# section 6), and the same token is in api's WORKER_TOKENS on the control plane.
#
# Image: vllm/vllm-openai:v0.31.0, pinned by digest below.
# The entrypoint is overridden with bash so that environment values, the JSON
# flag values and VLM_EXTRA_ARGS (parsed by eval, so quotes work) all behave.
# Compose reads $${...} as a literal ${...} for the shell; ${...} is filled by compose.
#
# --limit-mm-per-prompt width and height (1152x864 = 995328 px) must be changed
# together with VLM_MAX_PIXELS (1003520). Keep width x height at or below it.
#
# The defaults serve Qwen3.5-9B AWQ with thinking off and 2 slots (decision D1, 2026-10-20).
# VLM_EXTRA_ARGS uses ${VAR-default}: unset gives thinking off, empty gives no extra flag,
# which is what the Qwen3-VL checkpoints need (infra/README.md section 4).
#
# The worker reads the sidecar's own values, so the two can't drift apart: VLM_MODEL is
# VLM_MODEL@VLM_REVISION, VLM_SLOTS is VLM_MAX_NUM_SEQS, and VLM_MAX_PIXELS and VLM_API_KEY are shared.

x-logging: &logging
  driver: json-file
  # The live file up to 10 MB, plus four rotated files gzipped (compress): from about 12 MB per container.
  options: { max-size: "10m", max-file: "5", compress: "true" }
x-hardened: &hardened
  read_only: true
  tmpfs: ["/tmp:size=512m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  vllm-nv:
    image: vllm/vllm-openai@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        eval "set -- $${VLM_EXTRA_ARGS:-}"
        exec vllm serve "$${VLM_MODEL}" \
          --revision "$${VLM_REVISION}" \
          --served-model-name vlm \
          --max-model-len "$${VLM_MAX_MODEL_LEN}" \
          --max-num-seqs "$${VLM_MAX_NUM_SEQS}" \
          --max-num-batched-tokens 8192 \
          --gpu-memory-utilization "$${VLM_GPU_MEM_UTIL}" \
          --kv-cache-dtype "$${VLM_KV_CACHE_DTYPE}" \
          --enable-prefix-caching \
          --limit-mm-per-prompt '{"image":{"count":4,"width":1152,"height":864},"video":0}' \
          --mm-processor-kwargs "{\"size\":{\"longest_edge\":$${VLM_MAX_PIXELS},\"shortest_edge\":65536}}" \
          --structured-outputs-config.backend xgrammar \
          --structured-outputs-config.disable_any_whitespace true \
          --generation-config vllm \
          --max-cudagraph-capture-size 8 \
          --api-key "$${VLM_API_KEY}" \
          "$$@"
    env_file:
      - .env   # required: VLM_API_KEY has no default
    environment:
      VLM_MODEL: ${VLM_MODEL:-cyankiwi/Qwen3.5-9B-AWQ-4bit}
      VLM_REVISION: ${VLM_REVISION:-156edc4bbeb8d1910ee7be9196bafaf1bc052156}
      VLM_MAX_NUM_SEQS: ${VLM_MAX_NUM_SEQS:-2}
      VLM_GPU_MEM_UTIL: ${VLM_GPU_MEM_UTIL:-0.78}
      VLM_MAX_MODEL_LEN: ${VLM_MAX_MODEL_LEN:-16384}
      VLM_KV_CACHE_DTYPE: ${VLM_KV_CACHE_DTYPE:-auto}
      VLM_MAX_PIXELS: ${VLM_MAX_PIXELS:-1003520}
      VLM_EXTRA_ARGS: >-
        ${VLM_EXTRA_ARGS---default-chat-template-kwargs '{"enable_thinking": false}'}
      VLM_API_KEY: ${VLM_API_KEY:?set VLM_API_KEY in infra/.env}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLM_GPU_UUID:?set VLM_GPU_UUID in infra/.env}"]
              capabilities: [gpu]
    security_opt:
      - label=disable   # SELinux: allow the container to read the mounted cache
    ipc: host
    volumes:
      - ${HF_HOME_HOST:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s   # model load and CUDA graph capture are slow
    stop_grace_period: 30s
    restart: "no"
    logging: *logging

  vlm-worker-nv:
    # The worker's values have defaults and its token file is optional, so `up -d vllm-nv` still
    # works on its own (benchmarks, headless runs) before they are set. The worker itself needs both.
    image: ${WORKER_IMAGE:-worker:unset}   # ghcr.io/aacruzgon/greenlens/worker@sha256:…
    restart: unless-stopped
    <<: *hardened
    command: ["--caps", "vlm"]
    env_file:                       # WORKER_TOKEN; also in api's WORKER_TOKENS
      - path: ${PDM_ENV:-/srv/pdm/env}/.env.rig-5070ti-vlm-1
        required: false
    environment:
      WORKER_ID: rig-5070ti-vlm-1
      API_BASE_URL: ${API_BASE_URL:-https://pdm-cp.tailb3ce07.ts.net}   # the control plane's public URL
      VLM_BASE_URL: http://vllm-nv:8000
      VLM_API_KEY: ${VLM_API_KEY:?set VLM_API_KEY in infra/.env}
      VLM_ADAPTER: vllm
      VLM_SERVED_NAME: vlm
      VLM_MODEL: ${VLM_MODEL:-cyankiwi/Qwen3.5-9B-AWQ-4bit}@${VLM_REVISION:-156edc4bbeb8d1910ee7be9196bafaf1bc052156}
      VLM_QUANT: ${VLM_QUANT:-awq_w4a16}
      VLM_SERVER: vllm@v0.31.0
      VLM_BOX_FORMAT: norm1000
      VLM_CELL_PX: "32"
      VLM_MAX_PIXELS: ${VLM_MAX_PIXELS:-1003520}
      VLM_SLOTS: ${VLM_MAX_NUM_SEQS:-2}
    # Claims only once vLLM's /health answers, so no job waits on a model still loading.
    depends_on: { vllm-nv: { condition: service_healthy } }
    stop_grace_period: 30s          # DRAIN_SECONDS (20) + 10 s, worker 12
    logging: *logging
