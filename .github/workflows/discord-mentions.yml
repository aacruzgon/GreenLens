# Mention alerts on Discord, designed in docs/infra/discord-mentions.md. When an issue or pull
# request conversation comment mentions a team member's GitHub username, or an edit adds such a
# mention, .github/scripts/discord_mentions.py posts one alert to that person's channel. A new
# comment by someone else also alerts the issue's or pull request's author.
#
# issue_comment runs this file, and the checkout below, from the default branch, never from a pull
# request, so no pull request's code runs here, fork or not. The comment is untrusted: it reaches the
# script only through the event file, never through an expression in a shell command.
name: Discord mentions

on:
  issue_comment:
    types: [created, edited]

# Only for the checkout of the script; the alerts go out through the webhooks, not the token.
permissions:
  contents: read

jobs:
  notify:
    # Skip, before a runner starts, comments that can alert no one: no @, and no configured author to
    # alert (not for an edit, the author's own comment or a bot's). The script does the matching.
    # Expression comparisons ignore case; the second contains() allows a variable written as @name.
    if: >-
      contains(github.event.comment.body, '@') ||
      (github.event.action == 'created' &&
       github.event.comment.user.login != github.event.issue.user.login &&
       github.event.comment.user.type != 'Bot' &&
       (contains(format(' {0} {1} {2} {3} ', vars.GH_USER_SARAH, vars.GH_USER_SAM, vars.GH_USER_ALAN, vars.GH_USER_MARK),
                 format(' {0} ', github.event.issue.user.login)) ||
        contains(format(' {0} {1} {2} {3} ', vars.GH_USER_SARAH, vars.GH_USER_SAM, vars.GH_USER_ALAN, vars.GH_USER_MARK),
                 format(' @{0} ', github.event.issue.user.login))))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts/discord_mentions.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Alert each newly mentioned person, and the author a new comment is on
        env:
          GH_USER_SARAH: ${{ vars.GH_USER_SARAH }}
          GH_USER_SAM: ${{ vars.GH_USER_SAM }}
          GH_USER_ALAN: ${{ vars.GH_USER_ALAN }}
          GH_USER_MARK: ${{ vars.GH_USER_MARK }}
          DISCORD_WEBHOOK_SARAH: ${{ secrets.DISCORD_WEBHOOK_SARAH }}
          DISCORD_WEBHOOK_SAM: ${{ secrets.DISCORD_WEBHOOK_SAM }}
          DISCORD_WEBHOOK_ALAN: ${{ secrets.DISCORD_WEBHOOK_ALAN }}
          DISCORD_WEBHOOK_MARK: ${{ secrets.DISCORD_WEBHOOK_MARK }}
        run: python3 .github/scripts/discord_mentions.py "$GITHUB_EVENT_PATH"
