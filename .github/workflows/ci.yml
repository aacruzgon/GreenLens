# CI for the repository, designed in docs/infra/README.md section 2. It runs in stages:
#   1. changes, then lint, test, examples, docs, infra and app. Each runs only when its inputs changed.
#      A skipped job reports success.
#   2. security, live and era, only once lint (and, for live and era, test) have passed, so a broken
#      pull request stops early and holds a runner for less time.
#   3. ci: one check that fails if any job above failed or was cancelled. It's the only required
#      check in the ruleset, so renaming a job never breaks the ruleset.
#   4. On main and on v* tags: images builds and pushes api, worker and worker-cuda to GHCR.
#      On v* tags only: release creates the GitHub Release with the digests.
# Nothing deploys from CI: a person deploys by digest from the host (section 7). Actions are pinned
# by commit; Dependabot proposes updates.
#
# Runners: the jobs that build run on the labels in the repository variable RUNNER_LABELS, today
# the self-hosted runners rig-1 and rig-2 (label pdm; section 2, Runners). The light jobs, which
# take seconds (changes, docs, infra, security, ci, release), run on LIGHT_RUNNER_LABELS (label
# pdm-light): rig-3, kept for them, or an idle rig-1 or rig-2, which carry pdm-light too. So they
# don't queue behind Rust builds, and a stopped rig-3 holds nothing up. Without the variables, the
# jobs fall back to GitHub's ubuntu-26.04. Steps that need sudo or the Actions cache run only on GitHub's
# runners (`runner.environment == 'github-hosted'`); a self-hosted job keeps its build trees in
# the runner's home instead (.github/actions/self-hosted-env). Every checkout sets
# persist-credentials: false, so a job's token never sits in .git/config on a runner that the next
# job, from another pull request, can read.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per pull request; otherwise one per ref and commit, so a burst of merges, or a tag on
  # a commit main is still building, never cancels a waiting run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Line tables keep file and line in backtraces at a fraction of full debug info's size, so the
  # build trees and their caches fit a hosted runner's disk, and the rig's persistent ones stay small.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # check_examples.py builds outside backend/, where rust-toolchain.toml doesn't apply.
  RUSTUP_TOOLCHAIN: "1.99.1"
  REGISTRY: ghcr.io/aacruzgon/greenlens

jobs:
  # --- stage 1 ---------------------------------------------------------------------------------

  changes:
    runs-on: ${{ fromJSON(vars.LIGHT_RUNNER_LABELS || vars.RUNNER_LABELS || '["ubuntu-26.04"]') }}
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      docs: ${{ steps.diff.outputs.docs }}
      skills: ${{ steps.diff.outputs.skills }}
      infra: ${{ steps.diff.outputs.infra }}
      live: ${{ steps.diff.outputs.live }}
      era: ${{ steps.diff.outputs.era }}
      images: ${{ steps.diff.outputs.images }}
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=$PR_BASE ;;
            push) base=$PUSH_BEFORE ;;
            *) base= ;;
          esac
          all=false
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            all=true   # a manual run, a tag, a new branch or a rewritten history: run everything
            files=
          else
            files=$(git diff --name-only "$base"...HEAD)
          fi
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq '^\.github/(workflows/ci\.yml|actions/)'; then all=true; fi
          has() { [ "$all" = true ] || printf '%s\n' "$files" | grep -Eq "$1"; }
          out() { if has "$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          # store's tests read ml/'s manifest and templates (the copies inside backend/ must match them),
          # and domain's compare ml/knowledge/schema/ with the seed types.
          out rust   '^backend/(crates|bins|migrations|tools/era-eval)/|^backend/(Cargo\.toml|Cargo\.lock|clippy\.toml|rust-toolchain\.toml|openapi\.json|deny\.toml)$|^ml/models/(manifest\.toml|templates/)|^ml/knowledge/schema/'
          out docs   '\.md$|^backend/tools/docgen/'
          # check_examples.py copies the schema into its crate.
          out skills '^\.claude/skills/rust|^backend/migrations/'
          out infra  '^infra/|^\.github/'
          # The generated types come from backend/openapi.json, so a contract change runs the app job too.
          out app    '^app/|^backend/openapi\.json$'
          out live   '^backend/crates/(store|blob)/|^backend/migrations/|^backend/Cargo\.(toml|lock)$|^\.claude/skills/rust'
          # The Era tests run the clients and the sync against Era's simulators with the Maple Row fixture
          # (backend/tests/fixtures/era/).
          out era    '^backend/'
          # What the image build context holds (backend/.dockerignore leaves out tools/, except
          # era-eval, a workspace member).
          out images '^backend/(crates|bins|migrations|tools/era-eval)/|^backend/(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|openapi\.json|Dockerfile|docker-bake\.hcl|\.dockerignore)$'
          cat "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-26.04"]') }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.99.1 with rustfmt and Clippy
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      # The rig has libheif-dev 1.23.4 installed, and no sudo for its runners.
      - name: Install libheif (vision's heic feature needs 1.19 or newer)
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-dev
      - uses: ./.github/actions/self-hosted-env
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: "backend -> target"
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The GPU features need no GPU: ort loads ONNX Runtime at run time (load-dynamic).
      - run: cargo check -p worker --features cuda --locked
      - run: cargo check -p vision --features cuda,migraphx,webgpu --locked
      - run: cargo check -p vision --features heic --locked

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-26.04"]') }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.99.1 with rustfmt and Clippy
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - uses: ./.github/actions/self-hosted-env
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: "backend -> target"
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # HOME is the job's temp directory: the action downloads into ~/.install-action/tmp and deletes
      # it after, and the rig's runners share one home, so two jobs installing at once broke each
      # other's download (docs/infra/README.md section 2). The tool lands there and on PATH.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        env:
          HOME: ${{ runner.temp }}
        with:
          tool: cargo-nextest@0.9.148
      # Includes the api test that fails when backend/openapi.json is stale.
      - run: cargo nextest run --workspace --locked
      # nextest doesn't run doc tests; the compile-fail tests of the proofs and URL states are doc tests.
      - run: cargo test --doc --workspace --locked

  examples:
    needs: changes
    # The examples compile against versions.md and the schema, not the workspace crates, so they
    # don't wait for lint or test.
    if: needs.changes.outputs.skills == 'true' || github.event_name == 'push'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-26.04"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its build tree is the largest of any job (5.1 GB): 8.8 GB was left at the end without this.
      - uses: ./.github/actions/free-disk
      - name: Rust 1.99.1 with rustfmt and Clippy
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      # setup-python ships builds for GitHub's images only; the rig uses Debian's python3 (3.13).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
      - uses: ./.github/actions/self-hosted-env
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: "backend -> target"
          shared-key: examples
          key: ${{ hashFiles('.claude/skills/rust/versions.md') }}
          cache-targets: false
          cache-directories: ~/.cache/pdm-rust-skills-check/target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python3 .claude/skills/rust/scripts/check_examples.py
      - name: Disk left
        if: always()
        run: |
          df -h /
          du -sh "${CARGO_TARGET_DIR:-backend/target}" \
            "${PDM_RUST_SKILLS_TARGET_DIR:-$HOME/.cache/pdm-rust-skills-check/target}" 2>/dev/null || true

  docs:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ${{ fromJSON(vars.LIGHT_RUNNER_LABELS || vars.RUNNER_LABELS || '["ubuntu-26.04"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.99.1 with rustfmt and Clippy
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: The crate documents match the source
        run: |
          backend/tools/docgen/regen_all.sh
          git diff --exit-code docs/backend || {
            echo "::error::docs/backend is stale: run backend/tools/docgen/regen_all.sh and commit the result"
            exit 1
          }
      - run: python3 backend/tools/docgen/check_fences.py docs/backend
      - name: Every relative link and anchor resolves
        run: |
          shopt -s globstar
          python3 backend/tools/docgen/checklinks.py AGENTS.md CLAUDE.md docs/**/*.md

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ${{ fromJSON(vars.LIGHT_RUNNER_LABELS || vars.RUNNER_LABELS || '["ubuntu-26.04"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every compose file renders with the example env file
        run: |
          shopt -s nullglob
          # As infra/README.md says to on a host: the compose files read infra/.env.
          if [ -f infra/.env.example ]; then cp infra/.env.example infra/.env; fi
          for f in infra/*.compose.yml; do
            echo "$f"
            docker compose -f "$f" config -q
          done
      - name: Shell scripts parse and pass shellcheck
        run: |
          shopt -s nullglob globstar
          scripts=(infra/**/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then echo "no scripts"; exit 0; fi
          for s in "${scripts[@]}"; do bash -n "$s"; done
          shellcheck "${scripts[@]}"
      # Mention parsing, routing and delivery for discord-mentions.yml, against a mocked Discord.
      - name: The Discord mention script's tests pass
        run: python3 -m unittest discover -s .github/scripts -b

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-26.04"]') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # The generated types must match backend/openapi.json.
      - name: The generated types match the spec
        run: |
          npm run gen:api
          git diff --exit-code src/api/generated/schema.ts || {
            echo "::error::app/src/api/generated/schema.ts is stale: run npm run gen:api in app/ and commit the result"
            exit 1
          }
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run check:contrast
      - run: npx expo install --check

  # --- stage 2: only after lint (and test) pass --------------------------------------------------
  # `!cancelled() && !failure()` lets a job run when a job it needs was skipped for having no
  # changes, and stops it when one failed.

  security:
    needs: [changes, lint]
    if: ${{ !cancelled() && !failure() && (needs.changes.outputs.rust == 'true' || github.event_name == 'push') }}
    runs-on: ${{ fromJSON(vars.LIGHT_RUNNER_LABELS || vars.RUNNER_LABELS || '["ubuntu-26.04"]') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its own HOME, as in test.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        env:
          HOME: ${{ runner.temp }}
        with:
          tool: cargo-deny@0.20.2
      # RustSec advisories for what ships, with the accepted ones in backend/deny.toml.
      - run: cargo deny --locked check advisories

  live:
    needs: [changes, lint, test]
    if: ${{ !cancelled() && !failure() && (needs.changes.outputs.live == 'true' || github.event_name == 'push') }}
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-26.04"]') }}
    timeout-minutes: 30
    # Ephemeral host ports on loopback: the rig runs two jobs at once beside the developer's own
    # dev compose, which holds 18000 and 19000. The test step reads the ports back from `job`.
    services:
      surrealdb:
        image: surrealdb/surrealdb:v3.3.4@sha256:649a60a3b9c0177d9923c938e1c2563e48cde2a9d06ac2c0519714be719b02af
        command: start --user root --pass root memory
        ports: ["127.0.0.1::8000"]
        # Distroless: no /bin/sh for a --health-cmd, so the image's own exec-form check
        # (/surreal isready) runs, at this interval.
        options: >-
          --health-interval 5s --health-retries 12
      rustfs:
        image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_ACCESS_KEY: TESTROOT # the test's hard-coded key; CI only
          RUSTFS_SECRET_KEY: testrootsecret
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_CHECK_UPDATE: "false"
        ports: ["127.0.0.1::9000"]
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health/ready"
          --health-interval 5s --health-retries 12 --health-start-period 30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Two build trees; rust-cache's post step then unpacks every platform's crates and writes the
      # archive. Without this, the first save on main ran the disk out.
      - uses: ./.github/actions/free-disk
      - name: Rust 1.99.1 with rustfmt and Clippy
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - uses: ./.github/actions/self-hosted-env
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: "backend -> target"
          shared-key: live
          key: ${{ hashFiles('.claude/skills/rust/versions.md') }}
          cache-directories: ~/.cache/pdm-rust-skills-check/target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Its own HOME, as in test.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        env:
          HOME: ${{ runner.temp }}
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo nextest run -p store -p blob --run-ignored only --locked
        working-directory: backend
        env:
          PDM_TEST_SURREALDB_URL: ws://127.0.0.1:${{ job.services.surrealdb.ports['8000'] }}
          PDM_TEST_RUSTFS_URL: http://127.0.0.1:${{ job.services.rustfs.ports['9000'] }}
      # Starts its own SurrealDB container on an ephemeral port. --no-test: the examples job runs the rest.
      - run: python3 .claude/skills/rust/scripts/check_examples.py --live --no-test
      - name: Disk left
        if: always()
        run: |
          df -h /
          du -sh "${CARGO_TARGET_DIR:-backend/target}" \
            "${PDM_RUST_SKILLS_TARGET_DIR:-$HOME/.cache/pdm-rust-skills-check/target}" 2>/dev/null || true

  # Era's Slack and Google Drive simulators as service containers, the same images as the era profile
  # in infra/dev.compose.yml (docs/EON E6, infra section 2). Three pairs, because a fault is global to
  # a simulator and strict mode changes how it authenticates:
  #   era-slack, era-drive                open mode: every era_ test except the next two kinds
  #   era-slack-fault, era-drive-fault    open mode: era_fault_* only, so a fault never reaches
  #                                       another test (E6.2)
  #   era-slack-strict, era-drive-strict  AUTH_MODE=strict: era_strict_* only, the clients' OAuth
  #                                       exchanges (E6.4)
  # Ephemeral host ports on loopback, as in live: the rig runs two jobs at once, so two era jobs
  # would collide on fixed ports. The steps read the ports back from `job`.
  # One job with three nextest steps, not three jobs: they share one build and one runner's minutes,
  # and the pairs are separate containers, so the steps cannot disturb each other. Each step runs
  # even when an earlier one failed. Health is checked on /_admin/tenants, which faults never touch
  # (the image has python3 but no curl). In ci's needs since 2026-10-20, after five green runs on
  # main (docs/EON E6.3). The era_hosted_ tests call our hosted Era company, which meters every
  # request, so this job leaves them out; era-hosted.yml runs them nightly (E6.5).
  era:
    needs: [changes, lint, test]
    if: ${{ !cancelled() && !failure() && (needs.changes.outputs.era == 'true' || github.event_name == 'push') }}
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-26.04"]') }}
    timeout-minutes: 30
    services:
      era-slack:
        image: erabyeon/slack:189e10c16ec66ee1ca24ac5f7962cd7637174d0f@sha256:33382931f381da5dca51c45ad4ad7c7bfc07644d3240465bfd41e7b7ea2cb75f
        env:
          SIMCORE_SEED: "42"
          SIMCORE_TODAY: "2026-10-15"
          SIMCORE_FIDELITY: high
          AUTH_MODE: open
        ports: ["127.0.0.1::8080"]
        options: >-
          --health-cmd "python3 -c 'import sys,urllib.request as u; u.urlopen(sys.argv[1])' http://127.0.0.1:8080/_admin/tenants"
          --health-interval 5s --health-timeout 5s --health-retries 12 --health-start-period 10s
      era-drive:
        image: erabyeon/google-drive:189e10c16ec66ee1ca24ac5f7962cd7637174d0f@sha256:2b9cd2a79def5cac0c325bf0a325a83842eb41edf766b2b9a362e0ee33fa9424
        env:
          SIMCORE_SEED: "42"
          SIMCORE_TODAY: "2026-10-15"
          SIMCORE_FIDELITY: high
          AUTH_MODE: open
        ports: ["127.0.0.1::8080"]
        options: >-
          --health-cmd "python3 -c 'import sys,urllib.request as u; u.urlopen(sys.argv[1])' http://127.0.0.1:8080/_admin/tenants"
          --health-interval 5s --health-timeout 5s --health-retries 12 --health-start-period 10s
      era-slack-fault:
        image: erabyeon/slack:189e10c16ec66ee1ca24ac5f7962cd7637174d0f@sha256:33382931f381da5dca51c45ad4ad7c7bfc07644d3240465bfd41e7b7ea2cb75f
        env:
          SIMCORE_SEED: "42"
          SIMCORE_TODAY: "2026-10-15"
          SIMCORE_FIDELITY: high
          AUTH_MODE: open
        ports: ["127.0.0.1::8080"]
        options: >-
          --health-cmd "python3 -c 'import sys,urllib.request as u; u.urlopen(sys.argv[1])' http://127.0.0.1:8080/_admin/tenants"
          --health-interval 5s --health-timeout 5s --health-retries 12 --health-start-period 10s
      era-drive-fault:
        image: erabyeon/google-drive:189e10c16ec66ee1ca24ac5f7962cd7637174d0f@sha256:2b9cd2a79def5cac0c325bf0a325a83842eb41edf766b2b9a362e0ee33fa9424
        env:
          SIMCORE_SEED: "42"
          SIMCORE_TODAY: "2026-10-15"
          SIMCORE_FIDELITY: high
          AUTH_MODE: open
        ports: ["127.0.0.1::8080"]
        options: >-
          --health-cmd "python3 -c 'import sys,urllib.request as u; u.urlopen(sys.argv[1])' http://127.0.0.1:8080/_admin/tenants"
          --health-interval 5s --health-timeout 5s --health-retries 12 --health-start-period 10s
      era-slack-strict:
        image: erabyeon/slack:189e10c16ec66ee1ca24ac5f7962cd7637174d0f@sha256:33382931f381da5dca51c45ad4ad7c7bfc07644d3240465bfd41e7b7ea2cb75f
        env:
          SIMCORE_SEED: "42"
          SIMCORE_TODAY: "2026-10-15"
          SIMCORE_FIDELITY: high
          AUTH_MODE: strict
        ports: ["127.0.0.1::8080"]
        options: >-
          --health-cmd "python3 -c 'import sys,urllib.request as u; u.urlopen(sys.argv[1])' http://127.0.0.1:8080/_admin/tenants"
          --health-interval 5s --health-timeout 5s --health-retries 12 --health-start-period 10s
      era-drive-strict:
        image: erabyeon/google-drive:189e10c16ec66ee1ca24ac5f7962cd7637174d0f@sha256:2b9cd2a79def5cac0c325bf0a325a83842eb41edf766b2b9a362e0ee33fa9424
        env:
          SIMCORE_SEED: "42"
          SIMCORE_TODAY: "2026-10-15"
          SIMCORE_FIDELITY: high
          AUTH_MODE: strict
        ports: ["127.0.0.1::8080"]
        options: >-
          --health-cmd "python3 -c 'import sys,urllib.request as u; u.urlopen(sys.argv[1])' http://127.0.0.1:8080/_admin/tenants"
          --health-interval 5s --health-timeout 5s --health-retries 12 --health-start-period 10s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-disk
      - name: Rust 1.99.1 with rustfmt and Clippy
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - uses: ./.github/actions/self-hosted-env
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: "backend -> target"
          shared-key: era
          key: ${{ hashFiles('.claude/skills/rust/versions.md') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Its own HOME, as in test.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        env:
          HOME: ${{ runner.temp }}
        with:
          tool: cargo-nextest@0.9.148
      # A simulator generates its company on the first call that needs it (8 s locally, over 20 s on a
      # runner). One cheap call to each of the six makes the tests' first calls fast; the tests' own
      # clients also wait up to 90 s (ERA_TIMEOUT). The open and fault pairs generate per tenant, so a
      # minted credential and one data call warm the process; the strict pair needs no token for the
      # consent step, which is the call that generates the default company.
      - name: Warm up Era's simulators
        # Normally about 20 s; a hung simulator fails here, not at the job's 30 minutes.
        timeout-minutes: 5
        env:
          SLACK_PORT: ${{ job.services.era-slack.ports['8080'] }}
          DRIVE_PORT: ${{ job.services.era-drive.ports['8080'] }}
          SLACK_FAULT_PORT: ${{ job.services.era-slack-fault.ports['8080'] }}
          DRIVE_FAULT_PORT: ${{ job.services.era-drive-fault.ports['8080'] }}
          SLACK_STRICT_PORT: ${{ job.services.era-slack-strict.ports['8080'] }}
          DRIVE_STRICT_PORT: ${{ job.services.era-drive-strict.ports['8080'] }}
        run: |
          set -eu
          warm_open() {
            token=$(curl -sS -m 180 -X POST -H 'content-type: application/json' -d '{}' "$1/_admin/tenants/warmup/credentials" | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
            curl -sS -m 180 -o /dev/null -w "$1 %{http_code} %{time_total}s\n" -H "Authorization: Bearer $token" "$1/$2"
          }
          for port in "$SLACK_PORT" "$SLACK_FAULT_PORT"; do warm_open "http://127.0.0.1:$port" api/auth.test; done
          for port in "$DRIVE_PORT" "$DRIVE_FAULT_PORT"; do warm_open "http://127.0.0.1:$port" drive/v3/files; done
          curl -sS -m 180 -o /dev/null -w "strict slack %{http_code} %{time_total}s\n" -G "http://127.0.0.1:$SLACK_STRICT_PORT/oauth/v2/authorize" \
            --data-urlencode client_id=pdm-test --data-urlencode scope=channels:read \
            --data-urlencode redirect_uri=https://api.example/connectors/oauth/callback --data-urlencode state=warm
          curl -sS -m 180 -o /dev/null -w "strict google %{http_code} %{time_total}s\n" -G "http://127.0.0.1:$DRIVE_STRICT_PORT/o/oauth2/v2/auth" \
            --data-urlencode client_id=pdm-test --data-urlencode response_type=code \
            --data-urlencode scope=https://www.googleapis.com/auth/drive.readonly \
            --data-urlencode redirect_uri=https://api.example/connectors/oauth/callback --data-urlencode state=warm
      - name: Era tests
        working-directory: backend
        env:
          ERA_SLACK_BASE: http://127.0.0.1:${{ job.services.era-slack.ports['8080'] }}
          ERA_GOOGLE_BASE: http://127.0.0.1:${{ job.services.era-drive.ports['8080'] }}
        run: >-
          cargo nextest run -p integrations -p api --run-ignored only --locked
          -E 'test(/(^|::)era_/) and not test(/(^|::)era_fault_/) and not test(/(^|::)era_strict_/) and not test(/(^|::)era_hosted_/)'
      - name: Era fault tests
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          ERA_SLACK_BASE: http://127.0.0.1:${{ job.services.era-slack-fault.ports['8080'] }}
          ERA_GOOGLE_BASE: http://127.0.0.1:${{ job.services.era-drive-fault.ports['8080'] }}
        run: >-
          cargo nextest run -p integrations -p api --run-ignored only --locked
          -E 'test(/(^|::)era_fault_/)'
      - name: Era strict-mode OAuth tests
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          ERA_STRICT_SLACK_BASE: http://127.0.0.1:${{ job.services.era-slack-strict.ports['8080'] }}
          ERA_STRICT_GOOGLE_BASE: http://127.0.0.1:${{ job.services.era-drive-strict.ports['8080'] }}
        run: >-
          cargo nextest run -p integrations -p api --run-ignored only --locked
          -E 'test(/(^|::)era_strict_/)'
      - name: Disk left
        if: always()
        run: |
          df -h /
          du -sh "${CARGO_TARGET_DIR:-backend/target}" 2>/dev/null || true

  # --- stage 3: the one required check -----------------------------------------------------------

  ci:
    # live joined after four consecutive green pushes to main, era after five (infra §2).
    needs: [changes, lint, test, examples, docs, infra, app, security, live, era]
    if: always()
    runs-on: ${{ fromJSON(vars.LIGHT_RUNNER_LABELS || vars.RUNNER_LABELS || '["ubuntu-26.04"]') }}
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then echo "::error::failed or cancelled: $bad"; exit 1; fi

  # --- stage 4: images on main and tags; the release on tags -------------------------------------

  images:
    needs: [changes, lint, test, examples, docs, infra, app, security, live, era]
    if: >-
      ${{ !cancelled() && !failure() && github.event_name == 'push' &&
          (startsWith(github.ref, 'refs/tags/v') ||
           (github.ref == 'refs/heads/main' && needs.changes.outputs.images == 'true')) }}
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-26.04"]') }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      digests: ${{ steps.digests.outputs.lines }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: A tag must name a reviewed commit and a plain version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Every commit on main came through a reviewed pull request; a tag elsewhere did not.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$REF_NAME is not on main"; exit 1; }
          # The name becomes an image tag, so no commas (TAGS is comma-separated) and no "latest".
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::$REF_NAME is not vMAJOR.MINOR.PATCH[-pre]"; exit 1; }
      # Three images, two Rust builds and worker-cuda's 2.3 GB of layers.
      - uses: ./.github/actions/free-disk
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: runner.environment == 'github-hosted'
      # The rig keeps one docker-container builder, pdm-ci, whose layer cache outlives the job
      # (docs/setup/README.md, CI runner).
      - name: Use the rig's persistent builder
        if: runner.environment == 'self-hosted'
        run: echo "BUILDX_BUILDER=pdm-ci" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # On a tag, reuse the images main built for this commit, so the release lists the digests that
      # main's run summary already showed. A rebuild would change them (the created label at least).
      - id: reuse
        name: Reuse main's images for a tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          sha_tag="sha-${GITHUB_SHA::12}"
          for t in api worker worker-cuda; do
            docker buildx imagetools inspect "$REGISTRY/$t:$sha_tag" >/dev/null 2>&1 \
              || { echo "No $t:$sha_tag from main; building instead"; echo "done=false" >> "$GITHUB_OUTPUT"; exit 0; }
          done
          echo '{}' > meta.json
          for t in api worker worker-cuda; do
            docker buildx imagetools create -t "$REGISTRY/$t:$REF_NAME" "$REGISTRY/$t:$sha_tag"
            digest=$(docker buildx imagetools inspect "$REGISTRY/$t:$sha_tag" --format '{{json .Manifest.Digest}}' | tr -d '"')
            jq --arg t "$t" --arg d "$digest" '.[$t] = {"containerimage.digest": $d}' meta.json > meta.tmp && mv meta.tmp meta.json
          done
          echo "done=true" >> "$GITHUB_OUTPUT"
      - name: Build and push api, worker and worker-cuda
        if: steps.reuse.outputs.done != 'true'
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          tags="sha-${GITHUB_SHA::12}"
          if [ "$IS_TAG" = true ]; then tags="$tags,$REF_NAME"; else tags="$tags,main"; fi
          # On GitHub's runners the layer cache lives in GHCR, not the Actions cache, whose 10 GB the
          # Rust caches already use. The rig's builder keeps its own, so it only reads GHCR's and
          # doesn't upload every layer over a home connection.
          cache=()
          for t in api worker worker-cuda; do
            cache+=(--set "$t.cache-from=type=registry,ref=$REGISTRY/buildcache:$t")
            if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
              cache+=(--set "$t.cache-to=type=registry,ref=$REGISTRY/buildcache:$t,mode=max")
            fi
          done
          # The commit's time, not the build's, so the label is the same whenever this commit is built.
          TAGS="$tags" REVISION="$GITHUB_SHA" CREATED="$(git log -1 --format=%cI)" \
            docker buildx bake -f backend/docker-bake.hcl --push --metadata-file meta.json "${cache[@]}"
      - id: digests
        name: Record the digests
        run: |
          lines=$(jq -r --arg r "$REGISTRY" \
            'to_entries[] | select(.value["containerimage.digest"]) | "\(.key) \($r)/\(.key)@\(.value["containerimage.digest"])"' meta.json)
          { echo "### Images, ready for infra/deploy.sh"; echo '```'; echo "$lines"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          { echo "lines<<EOF"; echo "$lines"; echo "EOF"; } >> "$GITHUB_OUTPUT"

  release:
    needs: images
    if: ${{ !cancelled() && needs.images.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ fromJSON(vars.LIGHT_RUNNER_LABELS || vars.RUNNER_LABELS || '["ubuntu-26.04"]') }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the GitHub Release with the image digests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGESTS: ${{ needs.images.outputs.digests }}
        run: |
          { echo "## Images"; echo; echo "Deploy by digest with \`infra/deploy.sh\` (docs/infra/README.md section 7)."; echo
            echo '```'; echo "$DIGESTS"; echo '```'; } > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --generate-notes
