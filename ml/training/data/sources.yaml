# Every dataset and upstream model the training uses (docs/vision/training.md §3).
# fetch.py downloads each one, checks its SHA-256 and unpacks it under data/raw/<name>/.
# A null sha256 means "not pinned yet": fetch.py prints the hash so it can be filled in.
# Only sources with `ship: true` may go into weights we ship (licence allows commercial use).

datasets:
  - name: plantdoc_cls
    description: PlantDoc classification split, 13 crops, 28 classes, in-the-wild photos
    kind: github_archive
    repo: pratikkayal/PlantDoc-Dataset
    commit: 5467f6012d78d1c446145d5f582da6096f852ae8
    sha256: 94e2b99a500a63efbd48923ed48588fbb01f9b1db66a2d3b5c24eed6466da20f
    licence: CC BY 4.0
    citation: "Singh et al., PlantDoc: A Dataset for Visual Plant Disease Detection, CoDS-COMAD 2020"
    ship: true
    use: disease and species heads

  - name: plantdoc_det
    description: PlantDoc detection split, VOC boxes and CSVs, 29 classes
    kind: github_archive
    repo: pratikkayal/PlantDoc-Object-Detection-Dataset
    commit: 4730a233a555b30ee98e0879c63ad25d82407455
    sha256: 45811ced89d3e40fac185dbe56eb7935745aad34c5c1402d937f0281eae0d813
    licence: CC BY 4.0 (annotations); scraped photos keep their owners' copyright (unverified)
    citation: "Singh et al., PlantDoc: A Dataset for Visual Plant Disease Detection, CoDS-COMAD 2020"
    ship: true
    use: leaf detector (every class collapsed to leaf)

  # Field sets from training.md §3. URLs and hashes are filled in when each is fetched.
  - name: tom2024
    description: >-
      Tomato, onion, maize field photos (Samsung Galaxy M11), Burkina Faso, Jul 2022 to Jul 2023,
      30 classes, 12,227 labelled. Only CATEGORY A in English is fetched: category B is
      pre-augmented copies (they would leak across our splits) and CATA-French repeats A.
      Images are small (about 10 KB each).
    kind: mendeley_folder
    dataset: 3d4yg89rtr
    version: 1
    prefix: CATEGORY A/CATA-English/
    url: https://data.mendeley.com/datasets/3d4yg89rtr/1
    sha256: 165c8155145376ecd93289bad7effdd33210dc9b51672e6e40cc018cb37284a7   # SHA-256 of the sorted "path sha256" listing of its 10,498 files, per fetch.py
    licence: CC BY 4.0
    citation: >-
      Appiah O. et al. (2024) TOM2024, Mendeley Data V1, doi:10.17632/3d4yg89rtr.1;
      Data in Brief 59, 111357, doi:10.1016/j.dib.2025.111357
    ship: true
    use: tomato and corn field data

  - name: tomato_pakistan_2026
    description: >-
      Tomato Leaf Disease Classification Dataset in Pakistan: 7,200 files in 6 classes (early
      blight, late blight, Septoria leaf spot, leaf mould, yellow leaf curl virus, healthy),
      Sukkur IBA. Described as smartphone field photos, but every file is an augmented copy
      (about 934 originals) and 302 originals are PlantDoc's scraped web photos; the mapping
      groups copies and drops the PlantDoc ones (review of PR #6). No Data in Brief paper found
    kind: direct
    url: https://data.mendeley.com/public-files/datasets/3mbnb82mxd/files/0a6c3bb6-5241-43e3-bc3a-f2e4be91fcfe/file_downloaded
    sha256: 66380c1621a1b9fc6d60413f8ad41ec565778d1ef2c06729949387218c244c3c   # from Mendeley's API
    landing: https://data.mendeley.com/datasets/3mbnb82mxd/1
    licence: >-
      CC BY 4.0 as published; it can't cover photos the authors didn't take. The PlantDoc copies
      are dropped, and any other scraped photos keep their owners' copyright (unverified), the
      same caveat as plantdoc_det. Shipping weights trained on it is a team decision
      (docs/vision/README.md §9)
    citation: "Malik M.N., Ali S.H., Ali H. (2026) Mendeley Data V1, doi:10.17632/3mbnb82mxd.1"
    ship: true   # provisional, see licence
    use: tomato field data

  - name: ibean
    description: >-
      Bean leaves, Uganda, smartphone field photos annotated by NaCRRI: healthy, angular leaf
      spot, bean rust. 1,295 rows on Hugging Face against 1,296 stated on GitHub
    kind: huggingface
    repo_type: dataset
    repo: AI-Lab-Makerere/beans
    revision: 27aa014ce09b193e1a6f58112d4a66e0eddb69c5
    files: [data/train.zip, data/validation.zip, data/test.zip]
    landing: https://github.com/AI-Lab-Makerere/ibean
    licence: MIT
    citation: "Makerere AI Lab (2020) Bean disease dataset, https://github.com/AI-Lab-Makerere/ibean/"
    ship: true
    use: bean, only if beans become supported

  - name: plantcity
    description: >-
      PlantCity: in-field phone and DSLR leaf close-ups from Charsadda (tomato) and Chitral (the
      other crops), Pakistan; 52 classes in 52,219 files, flipped, turned and mirrored copies
      included, in train.zip and test.zip, with no names linking a copy to its photo (the ten
      classes read here hold 14,321 files and 1,236 photos once copies.py groups them). Only the
      members of seven tomato classes, tomato spider mites, and maize gray leaf spot and healthy
      are read, by HTTP range (1.8 GB of the 7.3 GB); the mapping drops maize gray leaf spot,
      whose photos don't show it
    kind: zip_members
    zips:
      - url: https://data.mendeley.com/public-files/datasets/w8kh2xkspx/files/09b2fa7e-ffc1-412f-a717-f0078c4861b5/file_downloaded   # Images/train.zip, 6,127,208,194 bytes
      - url: https://data.mendeley.com/public-files/datasets/w8kh2xkspx/files/cc5d2e50-03cd-450c-a444-4c6f48683d45/file_downloaded   # Images/test.zip, 1,128,347,591 bytes
    include:
      - '^(train|test)/(tomato_(bacterial_spot|early_blight|healthy_leaf|late_blight|leaf_curl|leaf_mold|septoria_leaf)|tomato spider mites|Corn gray leaf spot|Corn Normal leaf)/[^/]+\.(?i:jpe?g)$'
    url: https://data.mendeley.com/datasets/w8kh2xkspx/4
    sha256: 1179c60c718a8bc179e6e98c56ac7cfcc7db65fdf10c1bb1ca15e01d53a16b31   # SHA-256 of the sorted "path sha256" listing of its 14,321 members, per fetch.py
    licence: CC BY 4.0 (Mendeley Data record, read 2026-10-20; the Data in Brief article is CC BY-NC, the data is not)
    citation: >-
      Khan M.S., Nisa K., Ahmad I. (2026) PlantCity, Mendeley Data V4, doi:10.17632/w8kh2xkspx.4;
      Khan et al., Data in Brief 2025, 112130, doi:10.1016/j.dib.2025.112130
    ship: true
    use: tomato and corn field data (disease head)

  - name: maize_pretoria
    description: >-
      Diseases of maize in the field: 2,355 handheld field photos (phones, compacts and DSLRs),
      South Africa, 2009-2020, labelled per image in Database.csv with eight columns (several may be set). Only
      the images with one label among gray leaf spot, northern corn leaf blight, common rust and
      no foliar symptoms are read, by HTTP range, from the 10.8 GB zip: an image also flagged
      "Other" (tearing or insects) is kept, one flagged "UnidentifiedDisease" or with a second
      disease is not
    kind: zip_members
    zips:
      - url: https://ndownloader.figshare.com/files/36203652   # leaf_images.zip, 10,755,639,029 bytes
    labels:
      url: https://ndownloader.figshare.com/files/36203595   # Database.csv
      sha256: 9379d3df7fe528c2ab4e302ab76bb49cb94948405042b94224c97f90796aeb5d
      file_column: filePath
      exclusive: [GLS, NCLB, PLS, CR, SR, NoFoliarSymptoms, UnidentifiedDisease]
      keep: [GLS, NCLB, CR, NoFoliarSymptoms]
    url: https://doi.org/10.25403/UPresearchdata.20237613.v1
    sha256: c79952a00ef42f64d71a27980efda242028f71f7b343d6a527b57ebdf3a0e744   # SHA-256 of the sorted "path sha256" listing of its 1,270 members, per fetch.py
    licence: CC BY 4.0 (Figshare record, read 2026-10-20)
    citation: >-
      Craze H. (2022) Diseases of maize in the field, University of Pretoria, dataset,
      doi:10.25403/UPresearchdata.20237613.v1
    ship: true
    use: corn field data (disease head)

  - name: maize_makerere
    description: >-
      Makerere University Maize Image Dataset: phone photos in Ugandan fields (Lacuna Fund, 2021),
      named by their Unix time in milliseconds. Only the "Maize Leaf Blight" (northern corn leaf
      blight, per its datasheet) and healthy archives are fetched (MSV isn't one of our classes);
      the mapping samples about 600 photos per class so it doesn't swamp the other corn sources
    kind: archives
    files:
      - {name: MLB_1.rar, url: https://dataverse.harvard.edu/api/access/datafile/6284851, sha256: 91e491ae4c0d1f187b2d6372e23c22634abbc50d0f46eacc12f3eba52baaf9f0}
      - {name: MLB_2.rar, url: https://dataverse.harvard.edu/api/access/datafile/6284853, sha256: 2e3a3593f643a85f302620b58c402a2d081a0ac13faf7697cd9b4a59ac8e0847}
      - {name: Healthy_1.rar, url: https://dataverse.harvard.edu/api/access/datafile/6045938, sha256: 641dabcdc0f06ae5e65e38afde402691f712835fa8fade5fe3e4e090d1746cef}
      - {name: Healthy_2.rar, url: https://dataverse.harvard.edu/api/access/datafile/6045939, sha256: f319faa3e819b4dc90fe84786d6ec217e0c75397c68360d9e3a32f6a49544da7}
    url: https://doi.org/10.7910/DVN/LPGHKK
    licence: CC0 1.0 (Harvard Dataverse record, version 2.1, read 2026-10-20; its datasheet says CC BY)
    citation: >-
      Babirye C., Nakatumba-Nabende J. et al. (2022) Makerere University Maize Image Dataset,
      Harvard Dataverse V2.1, doi:10.7910/DVN/LPGHKK
    ship: true
    use: corn field data (disease head)

  - name: inat_species
    description: >-
      iNaturalist research photos of the five supported crops (whole plants, flowers, fruit) and
      five plant families, observed 2019-2025 with an agreeing identification, one photo per
      observation, re-encoded without metadata. The evaluation cases are all from 2026, and their
      observations are skipped too. The wild chiltepin (Capsicum annuum glabriusculum) is left
      out of pepper. Each photo's licence and credit are in splits/inat_species.tsv
    kind: inaturalist
    fetched_by: ml.training.data.inat_species
    index: splits/inat_species.tsv
    licence: CC0 1.0 or CC BY 4.0, per photo (credits in the index)
    citation: "iNaturalist, https://www.inaturalist.org; each photo's observer, as credited in the index"
    ship: true
    use: species head and the trained plant probe

  - name: plantseg
    description: >-
      PlantSeg, in-the-wild photos of diseased plants with pixel masks of their lesions; only the
      spot-type leaf diseases of the head's crops (about 0.28 GB of a 1.06 GB zip), whose masks
      fit the spot segmenter's colour thresholds
    kind: zip_members
    zips:
      - url: https://zenodo.org/records/17719108/files/plantseg.zip?download=1   # 1,057,281,724 bytes, md5:9358a66dff88cdd15c4fe009763c40a3
    include:
      - '^plantseg/Metadata\.csv$'
      - '^plantseg/(images|annotations)/(train|val|test)/(tomato_(bacterial_leaf_spot|early_blight|late_blight|septoria_leaf_spot|leaf_mold)|corn_(gray_leaf_spot|northern_leaf_blight|rust)|apple_(black_rot|rust|scab)|grape_(black_rot|leaf_spot|downy_mildew)|bell_pepper_(bacterial_spot|frogeye_leaf_spot|powdery_mildew)|(squash|zucchini)_(powdery_mildew|downy_mildew))_[^/]+\.(jpe?g|JPE?G|png)$'
    url: https://zenodo.org/records/17719108
    sha256: e91f8bb8c0cd1918228cfb178ac2a4d953c85a06f8cb88090404af7194274f8a   # SHA-256 of the sorted "path sha256" listing of its 3,903 members, per fetch.py
    licence: >-
      CC BY-NC 4.0 on this version, the latest of seven: Zenodo's versions of concept 13293890
      say CC BY-NC-ND 4.0 (13293891, 13762907, 13924591, 13958858), CC BY 4.0 (14935094,
      16665770) or CC BY-NC 4.0 (17719108), and GitHub says nothing (docs/vision/training.md 3).
      Its photos are scraped from the web, and Metadata.csv names each one's page. Non-commercial:
      fitting the spot thresholds only, never training data, and the photos are never republished.
      Whether thresholds fitted on it may ship is part of D12 (#14)
    citation: "Wei et al., PlantSeg: A Large-Scale In-the-wild Dataset for Plant Disease Segmentation, arXiv:2409.04038, 2024"
    ship: false
    use: spot colour thresholds (fitting only, never training data)
    leakage: false   # neither training data nor evaluation cases: check_leakage skips it

  - name: coco_val2017
    description: COCO val2017, 5,000 images (about 778 MB); the source of photos with no plant for scoring the plant check
    kind: direct
    url: http://images.cocodataset.org/zips/val2017.zip
    sha256: 4f7e2ccb2866ec5041993c9cf2a952bbed69647b115d0f74da7ce8f4bef82f05
    licence: "COCO: annotations CC BY 4.0; images keep their Flickr licences (unverified per image)"
    citation: "Lin et al., Microsoft COCO: Common Objects in Context, ECCV 2014"
    ship: false
    use: plant-check negatives (evaluation only, never training data)

  - name: coco_annotations_2017
    description: COCO 2017 train/val annotations (about 241 MB); instances_val2017.json says which val2017 images show a potted plant or broccoli
    kind: direct
    url: http://images.cocodataset.org/annotations/annotations_trainval2017.zip
    sha256: 113a836d90195ee1f884e704da6304dfaaecff1f023f49b6ca93c4aaae470268
    licence: "COCO: annotations CC BY 4.0; images keep their Flickr licences (unverified per image)"
    citation: "Lin et al., Microsoft COCO: Common Objects in Context, ECCV 2014"
    ship: false
    use: plant-check negatives (evaluation only, never training data)

  - name: openimages_v7_faces
    description: >-
      Open Images V7 validation and test tables (boxes, human-verified image labels, image
      information with each photo's Flickr original, licence and author; about 285 MB). The
      face-blur check's photos are picked from them by ml.training.data.faces: a `Human face` box
      and a verified plant, houseplant, flower, tree or flowerpot label, no group or depiction
      face box, a Flickr original of 2,000 px or more. The photos are kept under
      training/eval/faces/ (git-ignored), never trained on; each one's licence and credit are in
      splits/faces_openimages.tsv
    kind: files
    files:
      - {name: validation-annotations-bbox.csv, url: https://storage.googleapis.com/openimages/v5/validation-annotations-bbox.csv, sha256: d8bbd59410af14835d7733165a7bb8a3f0213981b22dd5077b0b9f7878991ff2}
      - {name: test-annotations-bbox.csv, url: https://storage.googleapis.com/openimages/v5/test-annotations-bbox.csv, sha256: fe22e579b9453875601576859d14ef3304058165de139c66b725e599202bd7b1}
      - {name: oidv7-val-annotations-human-imagelabels.csv, url: https://storage.googleapis.com/openimages/v7/oidv7-val-annotations-human-imagelabels.csv, sha256: 92ddbdfceb3626e044df5e89100b24f6c22a79c1888a4bddd00a6f231d86d56a}
      - {name: oidv7-test-annotations-human-imagelabels.csv, url: https://storage.googleapis.com/openimages/v7/oidv7-test-annotations-human-imagelabels.csv, sha256: 917d3ca8c0a2e09d652fb3148e9264df6117bfcaccf425a60a29b23269487953}
      - {name: validation-images-with-rotation.csv, url: https://storage.googleapis.com/openimages/2018_04/validation/validation-images-with-rotation.csv, sha256: ed93a0e121fe345effdfc7359b848dbc64a1ff6778c8c73563157cb500b33a17}
      - {name: test-images-with-rotation.csv, url: https://storage.googleapis.com/openimages/2018_04/test/test-images-with-rotation.csv, sha256: de55c6b8cbda32a79f4a20f28572d54e9c49d527a4006725675764074a51a36d}
      - {name: oidv7-class-descriptions.csv, url: https://storage.googleapis.com/openimages/v7/oidv7-class-descriptions.csv, sha256: 84a4373a0efb7fd6d93fe19b0e7ceb6c1b855c233d13b9b78a9a33655c9fdce3}
    url: https://storage.googleapis.com/openimages/web/index.html
    fetched_by: ml.training.data.faces (the photos)
    index: splits/faces_openimages.tsv
    licence: "Open Images: annotations CC BY 4.0 (Google); each image's own licence from its image-information row, CC BY 2.0 for every photo kept (checked per photo in the index)"
    citation: >-
      Kuznetsova A. et al. (2020) The Open Images Dataset V4, IJCV 128; each photo's Flickr
      author, as credited in the index
    ship: false
    use: face-blur recall of the upload's face detector (evaluation only, never training data)

models:
  - name: bioclip2
    description: BioCLIP 2, CLIP ViT-L/14, 768-dimensional embedding
    kind: huggingface
    repo: imageomics/bioclip-2
    revision: 2957b322090f9cb17ae72c71981c7218a28d81e0
    files: [open_clip_config.json, open_clip_model.safetensors, tokenizer.json, tokenizer_config.json, special_tokens_map.json, vocab.json, merges.txt]
    licence: MIT
    use: species zero-shot, image embeddings, features for the heads

  - name: rfdetr_small
    description: >-
      RF-DETR-S COCO weights, the leaf detector's starting point. rfdetr 1.11.2 downloads the
      same file by itself and checks only its own MD5 (fb37061c1af7bace359c91b723a8d5c1);
      detector/train.py loads this pinned copy instead
    kind: file
    url: https://storage.googleapis.com/rfdetr/small_coco/checkpoint_best_regular.pth
    dest: rfdetr/rf-detr-small.pth
    sha256: d81979a9213a2109345158ce9232668df4c1ae52e9b8db3f2ec0a8cbad959b33
    licence: Apache-2.0
    use: leaf detector fine-tuning
