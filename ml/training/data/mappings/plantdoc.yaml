  "Corn rust leaf":                     { species_id: corn,       problem_id: corn_common_rust }
  "grape leaf":                         { species_id: grape,      problem_id: healthy }
  "grape leaf black rot":               { species_id: grape,      problem_id: grape_black_rot }
  "Peach leaf":                         { species_id: peach,      problem_id: healthy }
