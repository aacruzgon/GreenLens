# PlantDoc class name → (species_id, problem_id | healthy)  (training.md §4, step 3)
#
# Slugs in the seed convention of contracts §10 (species: `tomato`; problems:
# `<crop>_<problem>`), confirmed by the knowledge-base owner on issue #4 (2026-10-18). They must
# match the knowledge base's species/ and problems/ files. A class whose problem has no
# knowledge-base profile is dropped (problem_id: null), never guessed.
# Used for both the classification split and the detection split (whose classes are the same
# names; the detector collapses them all to `leaf`).

dataset: plantdoc
source: plantdoc_cls                 # data/raw/<source>/
root: PlantDoc-Dataset-5467f6012d78d1c446145d5f582da6096f852ae8
splits: { train: train, test: test } # split → folder under root; the class is the image's folder
reviewed_by: sara-lahourpour  # slugs as confirmed on issue #4 (2026-10-22)

classes:
  "Apple leaf":                         { species_id: apple,      problem_id: healthy }
  "Apple rust leaf":                    { species_id: apple,      problem_id: apple_cedar_apple_rust }
  "Apple Scab Leaf":                    { species_id: apple,      problem_id: apple_scab }
  "Bell_pepper leaf":                   { species_id: pepper,     problem_id: healthy }
  "Bell_pepper leaf spot":              { species_id: pepper,     problem_id: pepper_bacterial_leaf_spot }
