# iBean → slugs  (training.md §4, step 3)
# Not used for the heads: bean is a label_only species (issue #4, 2026-10-22), not a disease-head
# crop, so train_disease.py leaves its classes out (--supported). Kept, with its slugs, so bean can
# become a head crop once its problems have profiles.

dataset: ibean
source: ibean
root: data
splits: { train: train/train, validation: validation/validation, test: test/test }
reviewed_by: sara-lahourpour  # slugs as confirmed on issue #4 (2026-10-22)

classes:
  "healthy":           { species_id: bean, problem_id: healthy }
  "angular_leaf_spot": { species_id: bean, problem_id: bean_angular_leaf_spot }
  "bean_rust":         { species_id: bean, problem_id: bean_rust }
