# stand-in above stays until no queued or leased job names it (README 6, the change-over).
[[model]]
name              = "bioclip_labels_edb29fe878952e7b"
version           = "edb29fe878952e7b"
file              = "bioclip_labels/bioclip_labels_edb29fe878952e7b.json"
sha256            = "7c327d832937330dc46f83c3836a193c9913a39ff92a3ae1819857d84828b36b"
licence           = "MIT"
source            = "the knowledge seed (#51, #131): 20 species (tomato full, the rest label_only) and 5 organisms, BioCLIP 2 text tower, 80 templates; ml/training/labels/bioclip_text.py"
runs_on           = "perception"
label_set_version = "edb29fe878952e7b"

  # The evaluation's dev cases, softmax over the 20 species rows (T 1); a case's shots combined
  # with the worker's weights (ml/training/eval/reports/species-check-2026-10-22).
  [model.check]
  dev_top1_per_shot  = 0.647             # 133 shots of tomato, apple, grape and corn; the stand-in the same
  dev_top1_per_case  = 0.610             # 105 cases, as the stand-in; tomato 28 of 63 (10 called potato, 8 pepper)
  dev_top3_all_cases = 0.713             # all 115 cases; squash 0 of 10, even under its genus

[[model]]
name                      = "disease_head_disease-head-v3c-2026-10-20"
version                   = "disease-head-v3c-2026-10-20"
file                      = "disease_head/disease-head-v3c-2026-10-20.json"
sha256                    = "0b035a88f44c69889c879e3415d087c22f94b669c68fcea231c302139187c33e"
licence                   = "Data CC BY 4.0 (PlantDoc, TOM2024, Tomato-Pakistan 2026, see its caveat in sources.yaml, PlantCity, Pretoria's maize) and CC0 1.0 (Makerere's maize); weights ours"
source                    = "logistic regression (C=5: the best val top-1 per crop within one standard error of the best dev top-3) on BioCLIP 2 fp16 features of our leaf detector's crops, 4 augmented views each, from PlantDoc, TOM2024, Tomato-Pakistan 2026, PlantCity, Pretoria's and Makerere's maize; 19 classes (tomato mosaic virus and corn curvularia leaf spot dropped: no knowledge profile); ml/training/heads/train_disease.py --features crops --views 4 --select-on dev-top3; report in ml/training/heads/reports/"
runs_on                   = "perception"
classifier_labels_version = "disease-head-v3c-2026-10-20"

  # T_disease (1.8206, fitted on the evaluation set's dev cases, their single-crop leaf photos;
  # evaluation.md §5) lives in the head file's `temperature` only (ml/models/FORMATS.md), so it
  # can't drift from the weights. Fitted on validation it would be 0.708.
  [model.config]
  crop_grow = 0.10

  # Restricted to the true species, a crop with k or fewer classes is right at top-k by
  # construction, so each top-k counts only crops with more than k classes, and calibration
  # only crops with 2 or more. Bean is outside the head. Per crop is what the worker returns:
  # each crop of a photo with exactly one crop. The dev numbers are the head's job: the right
  # problem in the top 3 the API adds to the candidates (architecture 6.3).
  [model.check]
  dev_top3_sent              = 0.843     # 83 dev leaf photos with a problem: the true one among the 3 classes the API keeps (guessing 0.572); v2c 0.735
  dev_medium_claims          = 24        # a problem at 0.5 or more at T_disease; 17 right
  test_top1_per_crop         = 0.850     # 758 one-crop test photos
  test_top1_per_photo        = 0.847     # 1,034 test photos, the mean of each photo's crops
  test_top3_over_3_classes   = 0.981     # 968 photos: tomato and corn
  test_ece_per_crop          = 0.079     # before T; 0.235 at T_disease, underconfident on photos like the training data's
  val_top1_per_crop          = 0.860     # 730 one-crop val photos
  test_top1_plantdoc         = 0.808     # 146 photos, web photos
  test_top1_tom2024          = 0.963     # 295 photos from field visits never trained on
  test_top1_tomato_pakistan  = 0.688     # 80 photos; v2c 0.762, the one set that loses
  test_top1_plantcity        = 0.797     # 153 photos; shots of one leaf below cosine 0.97 can straddle splits
  test_top1_maize_pretoria   = 0.713     # 178 photos
  test_top1_maize_makerere   = 0.934     # 182 photos from the same fields and week as training; 154 look-alike pairs at cosine 0.97+ span its splits, so not held out

[[model]]
name      = "plant_probe"
version   = "plant-probe-zs-2026-10-16"
file      = "plant_probe/plant-probe-zs-2026-10-16.json"
sha256    = "e9fbdf4053edfdf515b853c87e16cf515ccc26157b879af91cceda953d92d1a7"
licence   = "MIT (BioCLIP 2 text tower); weights ours, made from prompts only, no training data"
source    = "zero-shot: sigma(s * e . (t_plant - t_not)) with BioCLIP 2's text prototypes of prompt set A (plant: plant, leaves, garden plant; not: wall, person, pet, room, hand, car), 80 templates, s = 100; ml/training/heads/plant_probe.py --set A; report ml/training/eval/reports/plant-check-val-2026-10-16"
