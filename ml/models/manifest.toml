# --- perception (rig) and fallback: our files, in the private Hugging Face repository pdm-models ---

[[model]]
name      = "bioclip"
version   = "bioclip-2@2957b322"
file      = "bioclip/bioclip-2-vision-fp16.onnx"
sha256    = "b9016a6865e188c0a1129c368d4d92e4f1f0961fe5f391c71ede45e06ed54097"
licence   = "MIT"
source    = "imageomics/bioclip-2@2957b322090f9cb17ae72c71981c7218a28d81e0, vision tower, exported by ml/training/export/bioclip.py"
runs_on   = "perception"
opset     = 17
precision = "fp16"                       # LayerNormalization, Softmax, ReduceMean kept fp32; fp32 I/O

  [model.input]
  name   = "images"
  shape  = ["batch", 3, 224, 224]
  colour = "rgb"
  resize = "shortest_side_crop"
  mean   = [0.48145466, 0.4578275, 0.40821073]
  std    = [0.26862954, 0.26130258, 0.27577711]

  [model.outputs]
  embeddings = "embeddings"              # [batch, 768], L2-normalised in the graph

  [model.config]
  max_batch           = 16
  species_temperature = 1.0              # T_species, fitted on the dev cases Oct 22–23
  gpu_mem_limit_mb    = 1229

  [model.check]                          # 50 PlantDoc test photos vs PyTorch fp32
  min_cosine_b1  = 0.99961
  min_cosine_b3  = 0.99963
  min_cosine_b16 = 0.99963

[[model]]
name      = "leaf_detector"
version   = "rfdetr-s-leaf-2026-10-16b"
file      = "leaf_detector/rfdetr-s-leaf-2026-10-16b-fp16.onnx"
sha256    = "17bf8a8c410959db386a38ca16cfff5edc9b1d006c0584f334d306bee7f7b990"
licence   = "Apache-2.0 (RF-DETR-S weights and code); fine-tuned on PlantDoc boxes (CC BY 4.0)"
source    = "RF-DETR-S COCO weights (rfdetr 1.11.2), pinned in sources.yaml (rfdetr_small), fine-tuned 50 epochs at 512 px on PlantDoc's boxes collapsed to `leaf`; training images at cosine >= 0.97 to a test image dropped, train/valid split by same-plant group; ml/training/detector, exported by ml/training/export/detector.py"
runs_on   = "perception"
opset     = 17
precision = "fp16"                       # GridSample, Range, LayerNormalization, Softmax, ReduceMean kept fp32; fp32 I/O

  [model.input]
  name   = "input"
  shape  = ["batch", 3, 512, 512]
  colour = "rgb"
  resize = "squash"
  mean   = [0.485, 0.456, 0.406]
  std    = [0.229, 0.224, 0.225]

  [model.outputs]
  boxes  = "dets"                        # [batch, 300, 4], normalised cx, cy, w, h
  logits = "labels"                      # [batch, 300, 2], leaf at index 0, background last

  [model.config]
  score_threshold  = 0.35                # τ_det, set on the evaluation set
  tau_leaf         = 0.35                # τ_leaf of the plant check (models.md 2): provisional, = score_threshold (any kept leaf), from reports/tau-leaf-val-2026-10-16 (2.9% of val plant photos below, 5.6% at 0.5); fitted on the evaluation set Oct 22–23
  min_side_px      = 24
  max_per_image    = 40
  nms_iou          = 0.8
  max_batch        = 8
  gpu_mem_limit_mb = 1024

  [model.check]                          # deduplicated PlantDoc test split (236 images, 452 boxes), class-agnostic
  map50_torch = 0.9372
  map50_onnx  = 0.9373
  map50_95    = 0.729                    # PlantDoc's boxes are incomplete, so mAP can't measure recall (training.md §5)

[[model]]
name      = "sam_encoder"
version   = "sam2.1-hiera-tiny@de431c40"
file      = "sam2/sam2.1-hiera-tiny-encoder-fp16.onnx"
sha256    = "eb3d1a7b3894f8f7532a4d79ff883cb702ed050f4385bafe31553fc8d71433b2"
licence   = "Apache-2.0"
source    = "facebook/sam2.1-hiera-tiny@de431c4043854a71d8101e17995dfe596bf101a5 with facebookresearch/sam2@2b90b9f5, exported by ml/training/export/sam2.py"
runs_on   = "perception"
opset     = 17
precision = "fp16"

  [model.input]
  name   = "images"
  shape  = ["batch", 3, 1024, 1024]
  colour = "rgb"
  resize = "squash"
  mean   = [0.485, 0.456, 0.406]
  std    = [0.229, 0.224, 0.225]

  [model.outputs]
  high_res_feats_0 = "high_res_feats_0"  # [batch, 32, 256, 256]
  high_res_feats_1 = "high_res_feats_1"  # [batch, 64, 128, 128]
  image_embed      = "image_embed"       # [batch, 256, 64, 64]

  [model.config]
  max_batch        = 2
  # gpu_mem_limit caps the session's memory pool. Measured on the 5070 Ti in fp16 at batch 2:
  # 1,872 MiB above the loaded session (peak_minus_loaded_mib in sam2/check.json; 2,178 MiB for
  # the whole process with the CUDA context and weights). 1,638 would fail the warm-up (review
  # of PR #6, item 5); 2,048 leaves 176 MiB of margin. Recheck on the 3070 (evaluation.md §8).
  gpu_mem_limit_mb = 2048

  [model.check]
  mean_mask_iou_fp16 = 0.99966

[[model]]
name      = "sam_decoder"
version   = "sam2.1-hiera-tiny@de431c40"
file      = "sam2/sam2.1-hiera-tiny-box-decoder-fp16.onnx"
sha256    = "fda2d2366fda0657d95eb638c379815f8e79d505c5a08cc0c0245e5d3bd3a674"
licence   = "Apache-2.0"
source    = "as sam_encoder; inputs: one image's three feature tensors and boxes [N, 4] (corners, 1024 frame)"
runs_on   = "perception"
opset     = 17
precision = "fp16"                       # fp32 logits out

  [model.outputs]
  mask_single         = "mask_single"    # [N, 1, 256, 256] logits
  iou_single          = "iou_single"     # [N, 1]
  masks               = "masks"          # [N, 3, 256, 256]
  iou_predictions     = "iou_predictions"
  object_score_logits = "object_score_logits"

  [model.config]
  max_boxes        = 16
  min_iou          = 0.6                 # τ_mask
  plant_min_leaves = 3
  plant_grow       = 0.05
  plant_min_cover  = 0.6
  gpu_mem_limit_mb = 614

[[model]]
name              = "bioclip_labels_233482ce598f591b"
version           = "233482ce598f591b"
file              = "bioclip_labels/bioclip_labels_233482ce598f591b.json"
sha256            = "ffec89c4bcbfc91bd72de19015de4f71541a79eb06ac10185180e65292d8066d"
licence           = "MIT"
source            = "STAND-IN: 20 species from ml/training/labels/standin_labels.yaml, BioCLIP 2 text tower, 80 templates"
