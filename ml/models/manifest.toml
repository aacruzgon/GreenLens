  [model.config]
  tau_plant = 0.70                       # τ_plant of the plant check (models.md 2): provisional, with leaf_detector rfdetr-s-leaf-2026-10-19-bglic's tau_leaf 0.40 (val: 0.35% of plant photos fail, TOM2024 0.90%, 12.5% of COCO photos without a plant pass; test and hold-out: 0.23%, TOM2024 0.48%, 11.0%); fitted on the evaluation set Oct 22–23
