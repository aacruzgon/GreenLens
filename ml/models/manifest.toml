# Every model file a worker or `api` loads (docs/vision/README.md §6; backend vision.md §5).
# One manifest serves every host: each consumer verifies and loads only its own entries.
# Paths are relative to the manifest's own folder, as the loaders resolve them. Where each file
# is downloaded from is in sources.toml, keyed by SHA-256; fetch it with
#   python3 -m ml.models.fetch --for perception --dest DIR      (or api, fallback, ingest)
# which puts the files and this manifest in DIR (on a host: /models); point MODEL_MANIFEST at
# DIR/manifest.toml. Consumers check each file's SHA-256 at start-up and refuse to start on a
# mismatch. After changing this file, run `python -m ml.models.cpu_manifest` and
# `python -m ml.models.check`.
#
# Status 2026-10-22: development entries. The leaf detector is its clean fine-tune; the label
# matrix is the knowledge seed's (5 species, 5 organisms), beside the 20-species STAND-IN
# (ml/training/labels/standin_labels.yaml) during the change-over; the disease head is v3c on
# our detector's leaf crops, with #4's slugs, and the seed's classifier_labels.yaml maps
# tomato's 8 of its 19 classes. Thresholds are the docs' starting values, set from the
# evaluation set on Oct 22–23.

