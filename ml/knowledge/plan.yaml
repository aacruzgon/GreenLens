# The curation plan: the records the model steps draft (training.md §10). tag.py takes its id
# enums from here and from the seed, so a tag can't name an unknown id; extract.py drafts one
# record per entry that has no file in seed/ yet. Slugs follow #4 (decided 2026-10-17).
#
# The tomato slice: the seven problems disease head v3c predicts for tomato (its eighth tomato
# class is healthy; #120), the bacterial speck its sources pair with bacterial spot, blossom-end
# rot, the pests the sources cover, and the natural enemies the sources say attack them.
#
# The four-crop slice (#125): the seven problems disease heads v2c (#85) and v3c (#120) predict on
# apple, corn, grape and pepper, whose species are label_only (#51). The slugs are the training
# mappings' (D3), so classifier_labels.yaml can name them once they're signed.

# Sources with no reuse grant (sources.yaml): their facts go into the drafts, rewritten and
# cited, but their wording isn't committed. tag.py leaves them out of seed/chunks, extract.py
# reads them from build/tags, and the review files link them instead of quoting them.
facts_only_sources:
  - clemson_hgic_tomato_diseases
  - clemson_hgic_tomato_insect_pests
  - isu_growing_tomatoes_home_garden   # no chunks: the care profile cites it by hand

# Sources tagged with another model than tag.py's default (Sonnet 5.5): each failed its 10% spot
# check and was re-tagged (training.md §10, running it), so a plain re-run keeps that model.
tag_models:
  isu_two_spotted_spider_mite: claude-opus-5-5   # Sonnet dropped .4, a management paragraph (2026-10-20)

# Chunks withheld by hand at the signing review (2026-10-20, S5): they pass the dose check but
# mustn't reach the chat. tag.py withholds them as it does a chunk that gives a rate, so they
# stay out of seed/chunks; steps can still cite them, and the review files link them.
withheld_chunks:
  isu_parasitic_wasps.3: about wasps indoors, not in the garden
  isu_parasitic_wasps.4: about wasps indoors; reads as how to get rid of a beneficial
  edis_in307_twospotted_spider_mite.10: gives a rate (2%) the dose check doesn't catch
  ontario_tomato_bacterial_diseases.38: recommends tank-mixing mancozeb with copper (S1, S2)
  isu_two_spotted_spider_mite.4: lists malathion and permethrin as home sprays (S6)
  isu_tomato_hornworm.3: suggests a synthetic home garden insecticide for hornworms (S6)
  # #125's first review (2026-10-22), by the same rules:
  isu_black_rot_grape.2: recommends mancozeb or captan as home sprays (S1)
  edis_pp362_bacterial_spot_pepper.11: recommends combining copper with mancozeb (S1, S2)
  edis_pp362_bacterial_spot_pepper.12: recommends a copper-mancozeb spray programme (S1, S2)
  edis_pp362_bacterial_spot_pepper.13: advises Actigard, a commercial product, in tank mixes (S6)

species:
  - id: tomato
    name: Tomato
    scientific_name: Solanum lycopersicum

problems:
