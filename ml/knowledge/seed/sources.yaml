# The knowledge sources (contracts §10, SourceSeed): one document each. `licence` records the
# terms checked before ingesting it (architecture 5, licensing; open decision 7) and the credit
# line the publisher asks for, which the app shows next to an excerpt. The seed keeps verbatim
# excerpts, each linked back to `url`, as far as each source's terms allow: the EDIS, ISU Yard and
# Garden and Ontario pages are kept nearly whole, and the facts-only sources not at all. The
# profiles state facts in our own words.
#
# Terms, as each publisher states them (checked 2026-10-20; again on 2026-10-22 for #125's five
# sources, the Ontario chapter by its guide's page, the ISU and EDIS articles each on its own page):
# - Ontario (ontario.ca/page/copyright-information): "If credit is given and Crown copyright is
#   acknowledged, the materials may be reproduced for non-commercial purposes if no changes are
#   made to the original content." Commercial use needs a licence from the King's Printer.
# - Iowa State University Extension and Outreach, Yard and Garden (each article's own note): may
#   be republished without further permission "if published as written and if credit is given
#   to the author, Yard and Garden, and Iowa State University Extension and Outreach".
#   The how-to page "Growing Tomatoes in the Home Garden" carries no such note, only
#   "© Iowa State University of Science and Technology": facts only, no wording committed.
# - UF/IFAS EDIS (ask.ifas.ufl.edu/copyright, which both article pages link): the documents "are
#   made available under a Creative Commons Attribution-NonCommercial-NoDerivatives International
#   4.0 license, and are available to share and distribute for any noncommercial purpose with
#   attribution". The licence excludes individual images, and none is used.
# - Clemson HGIC: © Clemson University, no reuse grant found. Facts only (plan.yaml,
#   facts_only_sources): the profiles cite it, but none of its wording is committed.
#
# GreenLens is a non-commercial student project, which these terms cover. If it is ever
# commercialised, Ontario, EDIS and Clemson must be revisited (#46).

