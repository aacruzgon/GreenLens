name: Hornworm
scientific_name: Manduca
taxon_group: insect
role: pest
recognition: A large, bright green caterpillar, about as thick as a thumb and roughly 7.5–13 cm long when
  fully grown. It has a horn at its rear end. The tobacco hornworm has seven diagonal white stripes on
  each side and a curved red horn. The tomato hornworm has eight V-shaped markings on each side and a
  straight black horn. One source says the horn can also be green. It is well camouflaged on the leaves
  of tomato, pepper, eggplant and potato, where it strips foliage and may leave large open scars on fruit.
  Its eggs are smooth and round, about 1.6 mm across, light green turning white, and laid on the underside
  of leaves.
