id: two_spotted_spider_mite
name: Two-spotted spider mite
scientific_name: Tetranychus urticae
taxon_group: mite
role: pest
recognition: A tiny oval mite, about 0.4–0.5 mm long, barely visible without a hand lens. It is usually
  green, greenish-yellow, whitish or almost see-through, with two dark spots on its body; some are brown
  or orange-red. It sits mainly on the underside of leaves, often among fine silk webbing, on leaves with
  pale speckles.
