  weight: 2
  discriminating: false
  where: lower_leaves
  image_kinds:
  - whole_plant
  - leaf_closeup
- id: tomato_septoria_leaf_spot.spotted_leaves_yellow
  text: Badly spotted leaves turn yellow, then brown, and wither. Yellowing is rare until the spots are
