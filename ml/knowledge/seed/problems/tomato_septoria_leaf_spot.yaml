  question: Are the leaves with many spots turning yellow or brown?
  weight: 2
  discriminating: false
  where: lower_leaves
  image_kinds:
  - whole_plant
  - leaf_closeup
- id: tomato_septoria_leaf_spot.lower_leaf_drop
  text: Spotted leaves die and fall off, so the plant loses its leaves from the bottom up.
