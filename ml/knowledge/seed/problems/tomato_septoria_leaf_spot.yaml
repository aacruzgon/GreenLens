  where: lower_leaves
  image_kinds:
  - leaf_closeup
- id: tomato_septoria_leaf_spot.tan_centre_dark_border
  text: The spots have a light tan, beige or whitish centre with a dark brown border.
  question: Do the spots have a pale tan or whitish centre with a dark edge?
  weight: 3
  discriminating: true
  where: lower_leaves
  image_kinds:
  - leaf_closeup
- id: tomato_septoria_leaf_spot.black_specks_in_centre
  text: Tiny black specks (spore bodies) sit in the pale centre of older spots. A hand lens shows them
    clearly.
  question: Are there tiny black dots inside the pale centre of the spots?
  weight: 3
  discriminating: true
  where: lower_leaves
  image_kinds:
  - leaf_closeup
- id: tomato_septoria_leaf_spot.starts_on_lower_leaves
  text: Spots start on the older, lower leaves near the ground, usually after the plant begins to set
    fruit.
