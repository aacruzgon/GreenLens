  weight: 2
  discriminating: false
  where: upper_leaves
  image_kinds:
  - leaf_closeup
- id: tomato_whiteflies.sooty_mould_patches
  text: Dark, black sooty mould grows in patches on the honeydew and covers the leaves.
  question: 'Is there a black, powdery coating lying on the leaf surface, like soot?'
  weight: 2
  discriminating: true
  where: upper_leaves
  image_kinds:
  - leaf_closeup
- id: tomato_whiteflies.wilting_heavy_infestation
  text: Heavily infested plants wilt from the loss of sap.
