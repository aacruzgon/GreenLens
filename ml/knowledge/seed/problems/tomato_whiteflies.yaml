- id: tomato_whiteflies.irregular_ripening_streaks
  text: Fruit on heavily infested plants may colour unevenly, with streaks, and stay white and hard inside.
  question: Do the tomatoes have uneven colour, with streaks of unripe colour?
  weight: 1
  discriminating: false
  where: fruit
  image_kinds:
  - flower_fruit
conditions:
  notes: 'The sweetpotato whitefly (Bemisia) is mainly a pest in warm tropical and warm temperate
    regions. Outdoors it survives the winter only as far north as South Carolina; further north, Canada
    included, it lives in greenhouses. Its eggs hatch in about a week at 25 °C. Large swarms can fly in
    from old, dying crops nearby and badly infest newly planted ones. In Florida, Bemisia rarely reaches
    outbreak numbers where no insecticides are used, because natural enemies keep it down.'
