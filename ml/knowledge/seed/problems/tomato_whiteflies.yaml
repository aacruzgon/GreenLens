indicators:
- id: tomato_whiteflies.adult_whiteflies_under_leaves
  text: Tiny whitish-yellow insects with powdery white wings sit on the undersides of the leaves.
  question: Are there tiny white flying insects with white wings under the leaves?
  weight: 3
  discriminating: true
  where: leaf_underside
  image_kinds:
  - leaf_underside
- id: tomato_whiteflies.scale_like_nymphs
  text: Tiny flat, oval, greenish-yellow, scale-like young whiteflies sit stuck to the undersides of the
    leaves and do not move.
  question: Are there tiny flat, oval, pale yellow-green scales stuck under the leaves?
  weight: 2
  discriminating: true
  where: leaf_underside
  image_kinds:
  - leaf_underside
- id: tomato_whiteflies.yellow_feeding_spots
  text: Yellow spots sometimes appear on leaves where whiteflies feed.
