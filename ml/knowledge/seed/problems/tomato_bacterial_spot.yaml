conditions:
  notes: 'Favoured by warm, humid, wet weather; most outbreaks follow heavy rainstorms. Splashing rain,
    overhead watering and touching or handling wet plants spread the bacteria. They survive the winter on
    volunteer tomatoes and infected plant debris, and enter fruit through insect punctures and other
    wounds.'
looks_like:
- problem: tomato_bacterial_speck
  how_to_tell: Hard to tell apart by eye, especially early, so a lab test is recommended to confirm. On
    leaves, speck makes tiny black specks, usually 2 mm across or less; bacterial spot leaf spots can grow
    to 3 to 5 mm, and their centres dry out and tear into holes, so the leaf looks tattered. On fruit,
    speck makes pinpoint black specks (under about 1 to 3 mm) that are only slightly raised, sit on the
    surface and can be scraped off with a fingernail; bacterial spot makes bigger spots (up to about 4
    to 6 mm) that are raised and scabby and can turn brown and greasy-looking.
