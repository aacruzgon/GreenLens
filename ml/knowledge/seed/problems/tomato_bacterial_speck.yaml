- id: tomato_bacterial_speck.black_fruit_specks
  text: Tiny pinpoint black specks on the fruit, only slightly raised and not scabby, often with a narrow
    green to yellow ring. They sit on the surface and can be scraped off with a fingernail. Only young
    green fruit gets infected, but the black specks stay after the fruit ripens.
  question: Are there tiny pinpoint black specks on the tomato fruit that are only slightly raised, not
    rough or scabby?
  weight: 3
  discriminating: true
  where: fruit
  image_kinds:
  - flower_fruit
conditions:
  notes: Splashing water, wind-driven rain and storm mists spread the bacteria. Cool weather and stressed
    plants, as in early plantings, make it worse. The bacteria enter through natural openings and through
    wounds from wind-blown soil, insects, pruning, tools and handling.
