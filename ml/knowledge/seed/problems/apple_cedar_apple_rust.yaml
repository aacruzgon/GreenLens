conditions:
  notes: Warm, rainy days in spring (late April and early May in the source region) make the galls on
    cedars and junipers swell and release spores. Wind carries the spores to apple trees. Infection happens
    when spores land on a susceptible apple and conditions stay moist. The fungus needs both an apple
    and a cedar or juniper nearby to complete its life cycle.
