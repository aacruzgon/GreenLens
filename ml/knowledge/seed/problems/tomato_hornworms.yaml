- id: tomato_hornworms.open_scars_on_fruit
  text: In heavy infestations, fruit has large, open scars where the caterpillars ate the surface. They
    do not bore inside. This is much less common than leaf loss.
  question: Does the fruit have large, open, eaten scars on its surface?
  weight: 1
  discriminating: false
  where: fruit
  image_kinds:
