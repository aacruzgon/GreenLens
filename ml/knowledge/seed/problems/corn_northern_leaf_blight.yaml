conditions:
  notes: Moderate temperatures with long spells of humid or rainy weather favour the disease. Spores spread
    from old corn residue on the ground by wind and splashing rain.
  temp_c:
    max: 27
    min: 18
looks_like:
- problem: corn_gray_leaf_spot
  how_to_tell: Grey leaf spot makes narrow, rectangular, light-tan spots with straight sides that run
    along the leaf veins, about 2 to 7 cm long, turning grey as they age; it shows soon after tasselling.
    Northern corn leaf blight makes oval (elliptical), grey-green or tan streaks that can be much longer,
    about 2 to 15 cm.
