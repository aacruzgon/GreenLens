conditions:
  notes: Favoured by hot, dry weather and drought. Severe damage usually shows in late summer after a
    hot, dry spell. Mites develop fastest at about 27 °C and like the hot, dry weather of summer and autumn,
    but can appear at any time of year. In Iowa they become active in April and May and stay active all
    summer.
looks_like:
- problem: tomato_whiteflies
  how_to_tell: 'Both live on the underside of the leaf and leave tiny pale or yellow feeding spots.
    Spider mites spin fine silk webbing; whiteflies do not. Whitefly adults are tiny insects with powdery
    white wings. Whitefly young are flat, oval, greenish-yellow scales, about 0.4 to 0.7 mm long, that
    stay stuck flat to the leaf; spider mites are tiny oval mites, often with two dark spots. Whiteflies
    leave sticky honeydew, on which black sooty mould grows; spider mites leave the leaves bronzed or
    bleached.'
