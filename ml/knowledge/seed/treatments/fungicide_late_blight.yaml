id: fungicide_late_blight
kind: chemical
text: Late blight spreads fast, carried by rain and wind from plant to plant and garden to garden, and
  can kill all the leaves soon after the first spots. Fungicides work by stopping spores from growing,
  so use one to protect healthy plants before the disease reaches them, not once it is bad. Use a fungicide
  labelled for tomatoes that contains chlorothalonil, copper or mancozeb. Follow the label. It also says
  how many days to wait between spraying and picking; wait at least that long before you harvest.
