id: mulch_around_plants
kind: cultural
text: Mulch around tomato plants. After transplanting, cover the soil with 5 to 10 cm of organic mulch,
  such as chopped tree leaves, grass clippings or straw. It acts as a barrier that stops spores splashing
  up from the soil, which matters most when you cannot rotate crops.
