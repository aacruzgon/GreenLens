id: remove_crop_debris
kind: cultural
text: 'At the end of the season, pull out the old tomato plants and remove as much plant debris as you
  can from the garden; burn it or throw it away. Many tomato diseases survive the winter on old debris,
  and old plants keep tomato yellow leaf curl virus and its whiteflies going between crops, so for that
  virus remove the other plants that get it as well. Break up any debris you cannot remove: till the soil
  well in autumn, or, for bacterial speck and bacterial spot, work it well into the top 15 cm of soil
  so it breaks down quickly.'
