id: rust_resistant_apple_crabapple_cultivars
kind: cultural
text: Plant apple or crabapple varieties that resist cedar-apple rust. This is an easy way to avoid the
  disease. Redfree, Liberty, William's Pride and Freedom are apples that are immune to cedar-apple rust
  and to apple scab. Jonathan, Rome, Wealthy, York Imperial and Golden Delicious get the disease. Rust-resistant
  crabapples include Adams, David, Donald Wyman, Indian Summer, Prairie Fire, Professor Sprenger and White
  Angel. Avoid the crabapples Hopa, Radiant and Vanguard.
