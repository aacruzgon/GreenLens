id: check_mites_white_paper
kind: cultural
text: 'Look for mites, cast skins and webbing under the leaves with a magnifying glass. Or hold a sheet
  of white paper under the leaves and tap them sharply: mites show up as tiny, slow-moving specks. Spray
  only when the leaves show the typical speckling and you find a dozen or more mites on the sheet.'
