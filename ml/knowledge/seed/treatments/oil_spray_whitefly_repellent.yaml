id: oil_spray_whitefly_repellent
kind: chemical
text: 'Spray a canola oil product labelled for tomatoes, as the label directs. It repels whiteflies, reduces
  their feeding and may reduce the spread of tomato yellow leaf curl virus. Oil can burn leaves: some
  varieties are more sensitive, and weather, fertilisers and additives can raise the risk.'
