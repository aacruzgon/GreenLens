id: avoid_susceptible_junipers
kind: cultural
text: 'Avoid planting cedars and junipers that get the disease: eastern red cedar (Juniperus virginiana)
  and Rocky Mountain juniper (Juniperus scopulorum), and their varieties. Keeping apples and cedars apart
  helps less than you might think, because the spores can travel about 3 km.'
