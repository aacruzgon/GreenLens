id: copper_preventive_bacterial
kind: chemical
text: 'Copper is for prevention, not a cure. Start spraying a copper product labelled for tomatoes before
  any spots appear, while plants are young and before the main fruit set. If spots are already showing,
  it is too late to start this season: copper may slow the spread but will not clear an infection, so use
  the other steps now and plan copper for next season, starting before symptoms. Cover the leaves well
  and follow the label exactly, because too much copper damages plants. The label also says how many days
  to wait between spraying and picking; wait at least that long before you harvest. In some areas
  bacterial spot has become resistant to copper, so do not rely on copper alone.'
