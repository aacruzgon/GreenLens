id: copper_preventive_bacterial
kind: chemical
text: 'Copper is for prevention, not a cure. Start spraying a fixed copper product labelled for tomatoes
  before any spots or specks appear, while plants are young and before the main fruit set. If spots or
  specks are already showing, it is too late to start this season: copper may slow the spread but will
  not clear an infection, so use the other steps now and plan copper for next season, starting before
  symptoms. Adding mancozeb to the copper works better than copper alone. Cover the leaves well and follow
  the label exactly, because too much copper damages plants. The label also says how many days to wait
  between spraying and picking; wait at least that long before you harvest. Some of these bacteria resist
  copper. Most bacterial speck strains found in Ontario fields resist or tolerate it, so for speck it
  may not help much. In some areas bacterial spot has become resistant too, so do not rely on copper alone.'
sources:
