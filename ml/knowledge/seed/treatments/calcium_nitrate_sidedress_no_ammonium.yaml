id: calcium_nitrate_sidedress_no_ammonium
kind: cultural
text: When feeding beside or around the plants, avoid fertilisers with ammonium nitrogen, such as ammonium
  sulfate, ammonium nitrate and most complete (all-purpose) fertilisers. Ammonium competes with calcium.
  Calcium nitrate is usually the best choice. Follow the fertiliser label.
