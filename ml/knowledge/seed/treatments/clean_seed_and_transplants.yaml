id: clean_seed_and_transplants
kind: cultural
text: Use certified disease-free seed and plants, and do not plant diseased seedlings or transplants that
  have not been checked. For bacterial speck and bacterial spot, use seed that has been disinfected; ask
  your seed supplier how it was treated.
