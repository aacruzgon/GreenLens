id: fungicide_preventive
kind: chemical
text: 'Fungicides work as prevention, not as a cure: use them as a preventive programme, before the disease
  spreads. They seldom work alone, without the clean-up steps. Use a copper fungicide labelled for tomatoes.
  Read and follow the label. It also says how many days to
  wait between spraying and picking; wait at least that long before you harvest.'
