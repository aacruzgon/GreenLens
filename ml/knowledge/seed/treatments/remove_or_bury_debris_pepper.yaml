id: remove_or_bury_debris_pepper
kind: cultural
text: Remove infected plant debris, or dig it deeply into the soil. The bacteria survive in old crop debris
  that has not yet broken down. Clear old pepper and tomato debris before preparing the bed for a new
  season.
