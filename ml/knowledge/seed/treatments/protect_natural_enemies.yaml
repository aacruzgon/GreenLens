id: protect_natural_enemies
kind: biological
text: Helpful insects and mites keep many tomato pests down, so protect them and use insecticides only
  when needed. Helpful insects, among them small wasps, control hornworms. Spider mites are eaten by predatory
  mites, small lady beetles, minute pirate bugs, predatory thrips and lacewing larvae; predatory mites
  have longer legs, move fast and are often red or orange, so do not mistake them for pests. Whiteflies
  are killed by tiny parasitic wasps, lacewing larvae, minute pirate bugs, bigeyed bugs and small lady
  beetles; where no insecticides are used, these usually keep whiteflies low. An empty whitefly shell
  with a round hole means a helpful wasp hatched from it.
