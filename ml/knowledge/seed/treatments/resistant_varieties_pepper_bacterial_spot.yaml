id: resistant_varieties_pepper_bacterial_spot
kind: cultural
text: If bacterial spot has been a problem before, grow a pepper variety with resistance genes to bacterial
  spot. Some newer bell pepper varieties resist all known races, but many older varieties and many hot
  and specialty peppers do not. Choose the variety with care.
