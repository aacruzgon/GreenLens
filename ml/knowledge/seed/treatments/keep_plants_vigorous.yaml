id: keep_plants_vigorous
kind: cultural
text: 'Keep plants growing strongly. Stressed plants attract more insect pests, suffer more from spider
  mite feeding and catch diseases more easily. Plant in well-prepared, fertile beds that drain well, and
  after heavy rain get standing water away quickly. Mulch the plants, and water and feed them well;
  follow the fertiliser label.'
