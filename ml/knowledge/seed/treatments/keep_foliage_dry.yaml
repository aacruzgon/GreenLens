id: keep_foliage_dry
kind: cultural
text: 'Keep the leaves dry. Water at the base of the plants, for example with drip or furrow irrigation,
  rather than from above. If you must water from above, avoid doing it late in the day, and use low pressure
  so less water splashes: splashing carries spores and bacteria from leaf to leaf. Try to keep the leaves
  dry when you transplant, too.'
