id: tolerant_corn_hybrids_rust
kind: cultural
text: 'Choose corn hybrids with good tolerance to common rust. Commercial field corn hybrids have good
  tolerance. Many sweet corn and specialty corn hybrids, and seed corn inbreds, are very susceptible.
  Rotating crops and tilling don''t help against rust: its spores blow in from the south each year.'
