id: rotate_and_till_corn_residue
kind: cultural
text: Rotate crops and till old corn residue into the soil. The fungus survives the winter in corn residue,
  and rain splash and wind carry spores from it to new plants. If you do not till, rotating and growing
  resistant varieties matter even more.
