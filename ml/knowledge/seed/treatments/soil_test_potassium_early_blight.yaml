id: soil_test_potassium_early_blight
kind: cultural
text: 'Test the garden soil every year, keep potassium at a good level, lime as the soil test advises and
  side-dress with calcium nitrate; this makes early blight less severe. Follow the soil test and the
  fertiliser label.'
