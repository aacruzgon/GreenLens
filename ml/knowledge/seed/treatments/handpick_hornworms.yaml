id: handpick_hornworms
kind: mechanical
text: 'Pick off and destroy hornworms that are feeding. Leave any with white cocoons on their backs: they
  have stopped feeding, and helpful wasps will hatch from them. Hornworms do not hurt you. They are green
  like the leaves, so search carefully, especially when they are small.'
