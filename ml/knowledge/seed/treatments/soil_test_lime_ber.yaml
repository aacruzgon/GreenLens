id: soil_test_lime_ber
kind: cultural
text: Have the soil tested. Lime it as the soil report advises, to bring the pH to 6.5 and give enough
  calcium. Lime works best when put down 3 to 6 months before planting and dug into the soil. Follow the
  soil report for other fertiliser before planting.
